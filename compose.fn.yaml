# 飞牛 Compose：CMCC_WEB_PASSWORD 可留空，首次启动的默认密码是 123456。
# 登录后请在网页右上角修改；密码保存在数据卷中，更新镜像不会覆盖。
# 升级到新版本：docker compose pull && docker compose up -d
services:
  cmcc:
    image: rain5201/cmcc-daily:1.1.1
    restart: unless-stopped
    init: true
    ports:
      - "18080:8000"
    environment:
      CMCC_WEB_PASSWORD: ""   # 留空 = 使用默认密码 123456
      TZ: Asia/Shanghai
      CMCC_TASK_TIMEOUT: "3600"
      CMCC_RETENTION_DAYS: "30"
      CMCC_SECURE_COOKIE: "false"
    volumes:
      - cmcc-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cmcc-data:
