name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t cmcc-daily:test .
      - run: docker run --rm --read-only --tmpfs /tmp -v "$PWD/tests:/tests:ro" --entrypoint python cmcc-daily:test -m unittest discover -s /tests -p test_bootstrap.py -v
      - run: python tests/container_smoke.py
